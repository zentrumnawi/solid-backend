[tool.poetry]
name = "solid-backend"
version = "0.3.9"

description = "Clean Django app for e-learning application with..."
authors = [
	"Christian Grossmüller <chgad.games@gmail.com>",
	"Timotheus Kozlowski <kozlowski@itp.uni-frankfurt.de>"
]
license = "MIT"

readme = "README.md"
homepage = "https://github.com/zentrumnawi/solid-backend"
repository = "https://github.com/zentrumnawi/solid-backend"


[tool.poetry.dependencies]
python = "^3.8"
django = "^3.0.7"
djangorestframework = "3.11.0"
django-mptt = "0.11.0"
pillow = "7.1.2"
django-cleanup = "4.0.1"
psycopg2-binary = "^2.9.10"
mutagen = "^1.44.0"
django-stdimage = "^5.1.1"
django-taggit = "^1.5.1"
django-filter = "^21.1"


[tool.poetry.dev-dependencies]
black = "22.3.0"
flake8 = "*"
drf-yasg = "^1.20.0"


[tool.poetry.group.extras.dependencies]
drf-spectacular = "^0.25.1"


[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "3.0"
pytest-sugar = "^1.1.1"
django-environ = "0.6.0"
pytest = "8.3.5"
pytest-isort = "^4.0.0"
pytest-django = "4.8.0"
pytest-cov = "5.0.0"
coverage = "7.6.0"
django-coverage-plugin = "3.1.0"
gunicorn = "23.0.0"
werkzeug = "3.0.6"
django-extensions = "3.2.3"
ipdb = "0.13.13"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.black]
exclude = "migrations/"