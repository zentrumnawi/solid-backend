[tool.poetry]
name = "solid-backend"
version = "0.3.9"

description = "Clean Django app for e-learning application with..."
authors = [
	"Christian Grossmüller <chgad.games@gmail.com>",
	"Timotheus Kozlowski <kozlowski@itp.uni-frankfurt.de>"
]
license = "MIT"

readme = "README.md"
homepage = "https://github.com/zentrumnawi/solid-backend"
repository = "https://github.com/zentrumnawi/solid-backend"


[tool.poetry.dependencies]
python = "^3.8"
django = "^4.1"
djangorestframework = "3.14.0"
django-mptt = "0.14.0"
pillow = "10.4.0"
django-cleanup = "8.1.0"
psycopg2-binary = "^2.9.10"
mutagen = "^1.44.0"
django-stdimage = "^5.1.1"
django-taggit = "^4.0.0"
django-filter = "^23.5"


[tool.poetry.dev-dependencies]
black = "22.3.0"
flake8 = "*"
drf-yasg = "^1.20.0"


[tool.poetry.group.extras.dependencies]
drf-spectacular = "^0.25.1"


[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "4.3.0"
pytest-sugar = "^1.1.1"
django-environ = "0.11.2"
pytest = "8.3.5"
pytest-isort = "^4.0.0"
pytest-django = "4.8.0"
pytest-cov = "5.0.0"
coverage = "7.6.0"
django-coverage-plugin = "3.1.0"
gunicorn = "23.0.0"
werkzeug = "2.0.3"
django-extensions = "3.2.3"
ipdb = "0.13.13"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.black]
exclude = "migrations/"